name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy-production:
    needs: quality
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@57.0.0

      # Remote build on Vercel: the build runs on Vercel infrastructure, where
      # the project's (sensitive) Neon env vars are available. This lets the
      # vercel.json buildCommand run `drizzle-kit migrate` against Neon. A
      # local `--prebuilt` build would not have the sensitive credentials.
      - name: Deploy to production
        run: |
          set -euo pipefail
          output=$(vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "$output"
          url=$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n1)
          if [ -z "$url" ]; then
            echo "Failed to parse Vercel production URL from CLI output" >&2
            exit 1
          fi
          echo "Production URL: $url"
